<style>
  :root { --blue: #1F3864; --text: #111; --muted: #555; --line: #ddd; --bg: #fff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; display: flex; justify-content: center; padding: 48px 16px;
  }
  .card { width: 100%; max-width: 380px; text-align: center; }
  .photo {
    width: 160px; height: 160px; border-radius: 50%; object-fit: cover;
    display: block; margin: 0 auto 20px;
  }
  h1 { font-size: 26px; font-weight: 700; color: var(--blue); }
  .title { margin-top: 6px; font-size: 15px; color: var(--muted); line-height: 1.4; }
  .org { margin-top: 2px; font-size: 16px; font-weight: 600; }
  hr { border: 0; border-top: 2px solid var(--blue); width: 48px; margin: 24px auto; }
  .save {
    display: block; width: 100%; padding: 15px; border-radius: 10px;
    background: var(--blue); color: #fff; font-size: 17px; font-weight: 600; text-decoration: none;
  }
  .rows { margin-top: 24px; text-align: left; border-top: 1px solid var(--line); }
  .rows a {
    display: block; padding: 14px 4px; border-bottom: 1px solid var(--line);
    color: var(--text); text-decoration: none; font-size: 15px;
  }
  .rows span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 2px; }
 
  /* Intro: logo, then card */
  .intro {
    position: fixed; inset: 0; background: #fff; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    animation: introOut .45s ease 1.25s forwards; cursor: pointer;
  }
  .intro img { width: 180px; max-width: 55vw; opacity: 0; transform: scale(.92);
    animation: logoIn .6s ease .1s forwards; }
  @keyframes logoIn { to { opacity: 1; transform: none; } }
  @keyframes introOut { to { opacity: 0; visibility: hidden; } }
  .card > * { opacity: 0; transform: translateY(14px); animation: rise .5s ease forwards; }
  .card > *:nth-child(1) { animation-delay: 1.45s; }
  .card > *:nth-child(2) { animation-delay: 1.55s; }
  .card > *:nth-child(3) { animation-delay: 1.6s; }
  .card > *:nth-child(4) { animation-delay: 1.65s; }
  .card > *:nth-child(5) { animation-delay: 1.7s; }
  .card > *:nth-child(6) { animation-delay: 1.75s; }
  .card > *:nth-child(7) { animation-delay: 1.8s; }
  @keyframes rise { to { opacity: 1; transform: none; } }
  /* Tap to skip */
  body.skip .intro { display: none; }
  body.skip .card > * { animation: none; opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) {
    .intro { display: none; }
    .card > * { animation: none; opacity: 1; transform: none; }
  }
</style>
</head>
